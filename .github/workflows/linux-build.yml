name: Linux build & test

on:
  push:
    branches: [ linux-port-avalonia ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore LaserGRBL.Linux.sln

      - name: Build
        run: dotnet build LaserGRBL.Linux.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LaserGRBL.Linux.sln --configuration Release --no-build --logger trx

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

  package:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/linux-port-avalonia' && github.event_name == 'push'
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot dpkg-dev librsvg2-bin 2>/dev/null || true

      - name: Publish self-contained (linux-x64)
        run: |
          dotnet publish src/LaserGRBL.App/LaserGRBL.App.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o packaging/build/publish --nologo

      - name: Build .deb
        run: |
          VERSION=$(date +%Y.%m.%d)
          chmod +x packaging/build-linux.sh
          cd packaging && bash build-linux.sh "$VERSION" || true

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            linux/packaging/build/*.deb
            linux/packaging/build/*.AppImage
          if-no-files-found: warn
